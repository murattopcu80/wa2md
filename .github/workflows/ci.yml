name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]   # ubuntu-latest (26.04) has no Python 3.9 build
        python: ["3.9", "3.x"]   # oldest supported and the newest stable 3.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Show versions
        run: python --version
      - name: Install Playwright for the browser tests (Linux, newest Python only)
        # The tests drive the Google Chrome that the runner image already has (no browser download); without this step the
        # known-answer seal test and the sealed CDP round trip would be skipped in CI. Playwright needs Python 3.10+.
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.x'
        run: python -m pip install ".[browser]"
      - name: Run the test suite
        env:
          WA2MD_TEST_CHROME: ${{ (matrix.os == 'ubuntu-24.04' && matrix.python == '3.x') && '/usr/bin/google-chrome' || '' }}
        run: python -m unittest discover -s tests -v
      - name: Install the package and run the commands
        run: |
          python -m pip install .
          wa2md --help
          wa2md-web --help

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # scan the whole history of the checked-out ref
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"   # gitleaks_8.30.1_linux_x64.tar.gz
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact -v .'
