[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wa2md"
dynamic = ["version"]           # read from wa2md.__version__ (the one place of the version number)
description = "Convert WhatsApp chat exports to Markdown and anonymize them (removal of direct identifiers)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wa2md contributors" }]
keywords = ["whatsapp", "markdown", "anonymization", "privacy", "chat-export", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = []               # standard library only

[project.optional-dependencies]
# only for the experimental direct Chrome connection (wa2md-web list / export) and the real-Chrome tests
browser = ["playwright==1.65.2"]

[project.scripts]
wa2md = "wa2md:main"            # phone export (zip / folder) -> Markdown
wa2md-web = "wa_web:main"       # WhatsApp Web helper: snippet / import / list / export

[project.urls]
Homepage = "https://github.com/murattopcu80/wa2md"
Issues = "https://github.com/murattopcu80/wa2md/issues"
Changelog = "https://github.com/murattopcu80/wa2md/blob/main/CHANGELOG.md"

# Flat layout on purpose (two modules, the language-pack package and two data packages). The language packs
# (wa2md_lang/, issue #2) are imported; the dictionaries (adlar/) and the collector (wa2md_assets/wa_collect.js) are
# installed next to the modules, so the run-time lookups relative to the module file work in a checkout and when installed.
[tool.setuptools]
py-modules = ["wa2md", "wa_web"]
packages = ["adlar", "wa2md_assets", "wa2md_lang"]

[tool.setuptools.dynamic]
version = { attr = "wa2md.__version__" }

[tool.setuptools.package-data]
adlar = ["*.txt"]
wa2md_assets = ["*.js"]
